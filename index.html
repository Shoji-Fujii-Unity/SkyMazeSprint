<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>Sky Maze Sprint</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #071027;
            color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Sans", "Meiryo", sans-serif;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #071027;
            touch-action: none;
        }

        .hidden {
            display: none !important;
        }

        .screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: rgba(6, 14, 38, .78);
            backdrop-filter: blur(3px);
            touch-action: pan-y;
            overflow: auto;
        }

        #rotate {
            position: absolute;
            inset: 0;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #061025;
            color: #fff;
            text-align: center;
        }

        #rotate .inner {
            width: min(780px, 92vw);
            border-radius: 24px;
            padding: 32px;
            background: rgba(20, 42, 82, .95);
            box-shadow: 0 0 34px rgba(0, 255, 255, .12);
            font-weight: 900;
            letter-spacing: .06em;
        }

        .panel {
            width: min(860px, 95vw);
            max-height: 86vh;
            overflow: auto;
            padding: 18px 20px;
            border-radius: 22px;
            background: rgba(14, 27, 55, .94);
            border: 1px solid rgba(255, 255, 255, .09);
            box-shadow: 0 0 28px rgba(0, 255, 255, .08);
        }

        h1,
        h2 {
            margin: 0 0 12px;
            font-weight: 900;
            letter-spacing: .06em;
        }

        h1 {
            font-size: clamp(24px, 4vw, 46px);
            color: #b8f8ff;
            text-shadow: 0 0 18px rgba(61, 220, 255, .42);
        }

        h2 {
            font-size: clamp(18px, 3.2vw, 30px);
            color: #9cecff;
        }

        .lead {
            margin: 8px 0 14px;
            opacity: .82;
            line-height: 1.45;
        }

        .btns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        button {
            min-height: 48px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 14px;
            color: #fff;
            background: linear-gradient(135deg, rgba(61, 132, 255, .42), rgba(190, 72, 255, .32));
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }

        button.sound-off {
            background: linear-gradient(135deg, rgba(115, 115, 130, .52), rgba(115, 72, 125, .36));
        }

        button.current {
            outline: 3px solid rgba(255, 255, 255, .75);
        }

        .lang-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 12px;
        }

        #hud {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .stat {
            min-width: 64px;
            padding: 7px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255, 255, 255, .15);
            font-weight: 900;
            text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
        }

        .stat span {
            opacity: .75;
            font-size: .85em;
            margin-right: .35em;
        }

        #pauseBtn {
            pointer-events: auto;
            position: absolute;
            right: calc(10px + env(safe-area-inset-right));
            top: calc(10px + env(safe-area-inset-top));
            width: 48px;
            height: 48px;
            min-height: 48px;
            border-radius: 999px;
            padding: 0;
            font-size: 24px;
        }

        #controls {
            position: absolute;
            inset: 0;
            z-index: 25;
            pointer-events: none;
        }

        #joystick {
            position: absolute;
            left: calc(7% + env(safe-area-inset-left));
            bottom: calc(7% + env(safe-area-inset-bottom));
            width: min(24vmin, 180px);
            height: min(24vmin, 180px);
            max-width: 240px;
            max-height: 240px;
            border: 3px solid rgba(175, 255, 255, .24);
            border-radius: 50%;
            background: rgba(122, 255, 255, .08);
            pointer-events: auto;
            touch-action: none;
        }

        #thumb {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 40%;
            height: 40%;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: rgba(126, 245, 255, .88);
            box-shadow: 0 0 16px rgba(105, 235, 255, .45);
            pointer-events: none;
        }

        .actionButtons {
            position: absolute;
            right: calc(6% + env(safe-area-inset-right));
            bottom: calc(7% + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(3, minmax(54px, 86px));
            gap: 8px;
            pointer-events: none;
        }

        .actionButtons button {
            pointer-events: auto;
            width: 86px;
            height: 86px;
            max-width: 21vw;
            max-height: 21vw;
            border-radius: 50%;
            padding: 0;
            font-size: 14px;
            color: #061027;
            touch-action: none;
        }

        #btnAscend {
            background: #86f75f;
        }

        #btnDescend {
            background: #ffd25a;
        }

        #btnBrake {
            background: #ff6a7a;
        }

        .actionButtons button.active {
            transform: scale(.92);
            box-shadow: 0 0 24px rgba(255, 255, 255, .48);
        }

        #stageList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
            margin: 12px 0;
            max-height: 48vh;
            overflow: auto;
        }

        .stage-item {
            text-align: center;
            padding: 8px;
            font-size: 14px;
        }

        .stage-item .best-line {
            display: block;
            font-size: 11px;
            margin-top: 4px;
            color: #ffdc7d;
            opacity: .92;
        }

        .stage-item.locked {
            opacity: .32;
            pointer-events: none;
        }

        #controlsHint {
            position: absolute;
            left: 50%;
            top: calc(64px + env(safe-area-inset-top));
            transform: translateX(-50%);
            font-size: 12px;
            opacity: .45;
            text-align: center;
        }
    </style>
</head>

<body>
    <div id="app">
        <canvas id="threeCanvas"></canvas>

        <div id="rotate" class="hidden">
            <div class="inner">
                <div data-i18n="rotate"></div>
            </div>
        </div>

        <div id="hud" class="hidden">
            <div class="stats">
                <div class="stat"><span data-i18n="stage"></span><strong id="hudStage">1</strong></div>
                <div class="stat"><span data-i18n="time"></span><strong id="hudTime">0:00 / 0:00</strong></div>
                <div class="stat"><span data-i18n="score"></span><strong id="hudScore">0</strong></div>
                <div class="stat"><span data-i18n="rings"></span><strong id="hudRings">0/0</strong></div>
                <div class="stat"><span data-i18n="lives"></span><span id="hudLives">❤❤❤</span></div>
            </div>
            <div id="controlsHint">WASD / arrows move, Space / A ascend, S / B descend, Shift / C brake</div>
            <button id="pauseBtn" type="button">II</button>
        </div>

        <div id="controls" class="hidden">
            <div id="joystick">
                <div id="thumb"></div>
            </div>
            <div class="actionButtons">
                <button id="btnAscend" type="button" class="ctrl" data-act="A">▲</button>
                <button id="btnDescend" type="button" class="ctrl" data-act="B">▼</button>
                <button id="btnBrake" type="button" class="ctrl" data-act="C">BRAKE</button>
            </div>
        </div>

        <section id="screen-title" class="screen">
            <div class="panel">
                <h1 data-i18n="title"></h1>
                <div class="lead">3D Sky Flying / Rings Sprint</div>
                <div class="btns">
                    <button data-action="start" data-i18n="start"></button>
                    <button data-screen="stage" data-i18n="stageSelect"></button>
                    <button data-screen="settings" data-i18n="settings"></button>
                    <button data-screen="lang" data-i18n="language"></button>
                    <button id="btnFullscreen" type="button" data-action="fullscreen" data-i18n="fullscreen"></button>
                </div>
                <p class="lead">PC: WASD / Arrow Keys / Space / Shift<br>Mobile: Touch stick + Buttons (Landscape)</p>
            </div>
        </section>

        <section id="screen-stage" class="screen hidden">
            <div class="panel">
                <h2 data-i18n="stageSelect"></h2>
                <div id="stageList"></div>
                <div class="btns">
                    <button data-screen="title" data-i18n="back"></button>
                    <button data-action="start" data-i18n="start"></button>
                </div>
            </div>
        </section>

        <section id="screen-settings" class="screen hidden">
            <div class="panel">
                <h2 data-i18n="settings"></h2>
                <div class="lang-buttons">
                    <button id="btnSoundMaster"></button>
                    <button id="btnSoundBgm"></button>
                    <button id="btnSoundSfx"></button>
                </div>
                <div class="btns"><button data-screen="title" data-i18n="back"></button></div>
            </div>
        </section>

        <section id="screen-lang" class="screen hidden">
            <div class="panel">
                <h2 data-i18n="language"></h2>
                <div class="lang-buttons" id="languageList"></div>
                <div class="btns"><button data-screen="title" data-i18n="back"></button></div>
            </div>
        </section>

        <section id="screen-pause" class="screen hidden">
            <div class="panel">
                <h2 data-i18n="pause"></h2>
                <div class="btns">
                    <button data-action="resume" data-i18n="resume"></button>
                    <button data-screen="stage" data-i18n="stageSelect"></button>
                    <button data-screen="title" data-i18n="back"></button>
                </div>
            </div>
        </section>

        <section id="screen-result" class="screen hidden">
            <div class="panel">
                <h2 id="resultTitle"></h2>
                <div class="btns">
                    <div class="stat"><span data-i18n="stage"></span><strong id="resultStage"></strong></div>
                    <div class="stat"><span data-i18n="score"></span><strong id="resultScore"></strong></div>
                    <div class="stat"><span data-i18n="time"></span><strong id="resultTime"></strong></div>
                    <div class="stat"><span data-i18n="bestScore"></span><strong id="resultBestScore"></strong></div>
                    <div class="stat"><span data-i18n="bestTime"></span><strong id="resultBestTime"></strong></div>
                </div>
                <div class="btns">
                    <button id="btnNext" data-action="next" data-i18n="next"></button>
                    <button id="btnRetry" data-action="retry" data-i18n="retry"></button>
                    <button data-screen="stage" data-i18n="stageSelect"></button>
                    <button data-screen="title" data-i18n="back"></button>
                </div>
            </div>
        </section>

        <section id="screen-error" class="screen hidden">
            <div class="panel">
                <h2 data-i18n="error"></h2>
                <div class="lead">Three.js / WebGL が必要。</div>
                <div class="btns"><button data-screen="title" data-i18n="back"></button></div>
            </div>
        </section>
    </div>

    <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    <script>
        "use strict";

        const LANG_ORDER = ["ja", "en", "es", "pt"];
        const LANG_NAMES = { ja: "日本語", en: "English", es: "Español", pt: "Português" };

        const I18N = {
            en: {
                title: "Sky Maze Sprint", start: "Start", stageSelect: "Stage Select", settings: "Settings",
                language: "Language", back: "Back", pause: "Pause", resume: "Resume", retry: "Retry", next: "Next",
                masterSound: "Master Sound", bgm: "BGM", sfx: "SFX", on: "ON", off: "OFF",
                rotate: "Please use the game in landscape mode.", stage: "Stage", score: "Score", rings: "Rings",
                time: "Time", lives: "Lives", bestScore: "Best Score", bestTime: "Best Time", fullscreen: "Fullscreen",
                clear: "Stage Clear!", fail: "Game Over", failTime: "Time Up!", failMissed: "Missed the Goal!",
                error: "Failed to load 3D engine."
            },
            ja: {
                title: "Sky Maze Sprint", start: "ゲーム開始", stageSelect: "ステージ選択", settings: "設定",
                language: "言語", back: "戻る", pause: "一時停止", resume: "再開", retry: "リトライ", next: "次のステージ",
                masterSound: "全体サウンド", bgm: "BGM", sfx: "SE", on: "ON", off: "OFF",
                rotate: "画面を横向きにしてください", stage: "STAGE", score: "SCORE", rings: "RING",
                time: "TIME", lives: "LIFE", bestScore: "ベストスコア", bestTime: "ベストタイム", fullscreen: "全画面",
                clear: "ステージクリア！", fail: "ゲームオーバー", failTime: "時間切れ！", failMissed: "ゴールを通過しなかった！",
                error: "3Dエンジンの読み込みに失敗しました。"
            },
            es: {
                title: "Sky Maze Sprint", start: "Iniciar", stageSelect: "Seleccionar nivel", settings: "Ajustes",
                language: "Idioma", back: "Atrás", pause: "Pausa", resume: "Continuar", retry: "Reintentar", next: "Siguiente",
                masterSound: "Volumen general", bgm: "Música", sfx: "SFX", on: "ON", off: "OFF",
                rotate: "Por favor usa modo horizontal.", stage: "Nivel", score: "Puntos", rings: "Anillos",
                time: "Tiempo", lives: "Vidas", bestScore: "Mejor puntos", bestTime: "Mejor tiempo", fullscreen: "Pantalla completa",
                clear: "¡Nivel superado!", fail: "Fin del juego", failTime: "¡Tiempo agotado!", failMissed: "¡Meta perdida!",
                error: "No se pudo cargar el motor 3D."
            },
            pt: {
                title: "Sky Maze Sprint", start: "Iniciar", stageSelect: "Selecionar fase", settings: "Configurações",
                language: "Idioma", back: "Voltar", pause: "Pausa", resume: "Continuar", retry: "Tentar novamente", next: "Próxima",
                masterSound: "Som principal", bgm: "BGM", sfx: "SFX", on: "ON", off: "OFF",
                rotate: "Use o jogo em modo paisagem.", stage: "Fase", score: "Pontos", rings: "Anéis",
                time: "Tempo", lives: "Vidas", bestScore: "Melhor pontuação", bestTime: "Melhor tempo", fullscreen: "Tela cheia",
                clear: "Fase concluída!", fail: "Fim de jogo", failTime: "Tempo esgotado!", failMissed: "Meta perdida!",
                error: "Falha ao carregar motor 3D."
            }
        };

        function t(key) {
            const lang = save?.settings?.language || "en";
            return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
        }

        const SAVE_KEY = "SkyMazeSprint3D_v1";

        function loadSave() {
            try {
                const raw = localStorage.getItem(SAVE_KEY);
                const parsed = raw ? JSON.parse(raw) : {};
                return {
                    settings: {
                        language: LANG_ORDER.includes(parsed.settings?.language) ? parsed.settings.language : "en",
                        sound: {
                            master: parsed.settings?.sound?.master !== false,
                            bgm: parsed.settings?.sound?.bgm !== false,
                            sfx: parsed.settings?.sound?.sfx !== false
                        }
                    },
                    progress: {
                        currentStage: parseInt(parsed.progress?.currentStage, 10) || 1,
                        nextStage: parseInt(parsed.progress?.nextStage, 10) || 1,
                        maxStage: parseInt(parsed.progress?.maxStage, 10) || 1,
                        best: parsed.progress?.best && typeof parsed.progress.best === "object" ? parsed.progress.best : {},
                        totalClears: parseInt(parsed.progress?.totalClears, 10) || 0
                    }
                };
            } catch (e) {
                return {
                    settings: { language: "en", sound: { master: true, bgm: true, sfx: true } },
                    progress: { currentStage: 1, nextStage: 1, maxStage: 1, best: {}, totalClears: 0 }
                };
            }
        }

        let save = loadSave();
        function saveNow() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }

        const canvas = document.getElementById("threeCanvas");
        const hud = document.getElementById("hud");
        const controls = document.getElementById("controls");
        const hudStage = document.getElementById("hudStage");
        const hudTime = document.getElementById("hudTime");
        const hudScore = document.getElementById("hudScore");
        const hudRings = document.getElementById("hudRings");
        const hudLives = document.getElementById("hudLives");
        const rotateBox = document.getElementById("rotate");
        const pauseBtn = document.getElementById("pauseBtn");
        const joystick = document.getElementById("joystick");
        const thumb = document.getElementById("thumb");
        const languageList = document.getElementById("languageList");
        const stageList = document.getElementById("stageList");

        let currentScreen = "title";
        let isPlaying = false;
        let isPaused = false;
        let manualPaused = false;
        let orientationPaused = false;
        let stageEnded = false;

        let renderer, scene, camera, starField;
        let player, stageGroup;
        let entities = [];
        let checkpoint = null;
        let currentStageNumber = save.progress.currentStage || 1;
        let stage = null;
        let stageState = null;
        let lastFrameTime = 0;

        const audio = { ctx: null, masterGain: null, bgmGain: null, sfxGain: null, bgmTimer: null, bgmNext: 0, bgmStep: 0 };
        const BG_NOTES = [330, 392, 523.25, 392, 294, 370, 494, 392, 262, 330, 440, 523, 294, 392, 494, 440];

        function initAudio() {
            if (audio.ctx) return true;
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                audio.ctx = new AC();
                audio.masterGain = audio.ctx.createGain();
                audio.bgmGain = audio.ctx.createGain();
                audio.sfxGain = audio.ctx.createGain();
                audio.bgmGain.connect(audio.masterGain);
                audio.sfxGain.connect(audio.masterGain);
                audio.masterGain.connect(audio.ctx.destination);
                return true;
            } catch (e) { return false; }
        }
        function updateGains() {
            if (!audio.ctx) return;
            if (audio.masterGain) audio.masterGain.gain.value = save.settings.sound.master ? 1 : 0;
            if (audio.bgmGain) audio.bgmGain.gain.value = (save.settings.sound.master && save.settings.sound.bgm) ? 0.78 : 0;
            if (audio.sfxGain) audio.sfxGain.gain.value = (save.settings.sound.master && save.settings.sound.sfx) ? 0.95 : 0;
        }
        function startBgm() {
            if (!audio.ctx || !save.settings.sound.master || !save.settings.sound.bgm || audio.bgmTimer) return;
            audio.bgmNext = audio.ctx.currentTime + 0.12;
            audio.bgmStep = 0;
            audio.bgmTimer = window.setInterval(scheduleBgm, 50);
        }
        function stopBgm() { if (audio.bgmTimer) { clearInterval(audio.bgmTimer); audio.bgmTimer = null; } }
        function bgmAllowed() {
            if (!save.settings.sound.master || !save.settings.sound.bgm) return false;
            if (currentScreen === "pause" || currentScreen === "result") return false;
            if (currentScreen === "play" && isPaused) return false;
            return true;
        }
        function applySoundSettings() {
            if (audio.ctx) {
                if (audio.ctx.state === "suspended") audio.ctx.resume().catch(() => { });
                updateGains();
                if (bgmAllowed()) startBgm(); else stopBgm();
            } else stopBgm();
        }
        function playNote(type, freq, dur, startAt, vol = 0.25, fEnd = null, dest) {
            if (!audio.ctx) return;
            try {
                const ctx = audio.ctx;
                const at = Math.max(ctx.currentTime + 0.001, startAt);
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(Math.max(1, freq), at);
                if (fEnd) osc.frequency.exponentialRampToValueAtTime(Math.max(1, fEnd), at + dur);
                g.gain.setValueAtTime(0.0001, at);
                g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), at + 0.012);
                g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
                osc.connect(g); g.connect(dest || audio.sfxGain);
                osc.start(at); osc.stop(at + dur + 0.03);
            } catch (e) { }
        }
        function scheduleBgm() {
            if (!audio.ctx || document.hidden || !audio.bgmTimer) return;
            const ctx = audio.ctx;
            if (audio.bgmNext < ctx.currentTime + 0.03) audio.bgmNext = ctx.currentTime + 0.05;
            const look = 0.14;
            while (audio.bgmNext < ctx.currentTime + look) {
                const f = BG_NOTES[audio.bgmStep % BG_NOTES.length];
                playNote("triangle", f, 0.16, audio.bgmNext, 0.09, f * 1.15, audio.bgmGain);
                playNote("sine", f * 0.5, 0.14, audio.bgmNext, 0.055, f * 0.45, audio.bgmGain);
                audio.bgmNext += 0.245; audio.bgmStep++;
            }
        }
        function sfxRing() { if (!save.settings.sound.sfx) return; playNote("triangle", 760, 0.06, audio.ctx ? audio.ctx.currentTime + 0.001 : 0, 0.22, 940); }
        function sfxCollect() { if (!save.settings.sound.sfx) return; playNote("sine", 523.25, 0.09, audio.ctx ? audio.ctx.currentTime + 0.001 : 0, 0.16, 1046); }
        function sfxHit() { if (!save.settings.sound.sfx) return; playNote("sawtooth", 260, 0.12, audio.ctx ? audio.ctx.currentTime + 0.001 : 0, 0.22, 90); }
        function sfxClear() {
            if (!save.settings.sound.sfx || !audio.ctx) return;
            const now = audio.ctx.currentTime;
            playNote("triangle", 523.25, 0.11, now, 0.18, 659);
            playNote("triangle", 659.25, 0.11, now + 0.1, 0.18, 783);
            playNote("triangle", 783.99, 0.16, now + 0.2, 0.2, 1046);
        }
        function sfxFail() { if (!save.settings.sound.sfx || !audio.ctx) return; const now = audio.ctx.currentTime; playNote("sawtooth", 330, 0.2, now, 0.2, 110); }
        function startAudio() { if (!audio.ctx) initAudio(); applySoundSettings(); }

        function applyLanguage() {
            document.documentElement.lang = save.settings.language || "en";
            document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
            updateSoundLabels(); updateLanguageButtons();

        const keyboard = {};

            function updateJoystick(x, y, cx, cy) {

        function seededRand(seed) {

        function makeStars() {

        function initThree() {

        function disposeStageObject() {

        function makeStandard(color, emissive = color, roughness = .62, metalness = .06) {

        function loadStage(num) {
            if (!renderer) { if (!initThree()) return false; }
            disposeStageObject();
            entities = [];
            currentStageNumber = num;
            save.progress.currentStage = num;
            save.progress.maxStage = Math.max(save.progress.maxStage || 1, num);
            saveNow();

            const capStage = Math.min(num, 170);
            const diff = Math.pow(capStage / 170, 0.8);
            const length = 170 + capStage * 1.85;
            const ringSpacing = Math.max(19, 25 - diff * 7);
            const baseSpeed = 55 + diff * 50;
            const timeLimit = Math.max(45, 70 + capStage * 0.6);

            stage = { num, diff, length, finishZ: length + 70, ringSpacing, baseSpeed, timeLimit, ringRadius: 3.0, totalRings: 0, orbs: 0 };

            stageGroup = new THREE.Group();
            scene.add(stageGroup);

            player.position.set(0, 0, -38);
            player.rotation.set(0, 0, 0);
            camera.position.set(0, 7, -58);

            stageState = { t: 0, speed: stage.baseSpeed * 0.68, invuln: 0, score: 0, ring: 0, orb: 0, lives: 3, passed: 0, hits: 0 };
            checkpoint = player.position.clone();

            const rand = seededRand(num * 1013 + 97);

            // ground grid
            const grid = new THREE.GridHelper(stage.length + 240, 60, 0x1a3a66, 0x10203a);
            grid.position.set(0, -9, stage.length / 2);
            stageGroup.add(grid);

            // clouds
            for (let i = 0; i < 16; i++) {
                const geo = new THREE.IcosahedronGeometry(2 + rand() * 3, 0);
                const mat = new THREE.MeshStandardMaterial({ color: 0x2a3a66, emissive: 0x101a33, roughness: 1, metalness: 0, transparent: true, opacity: 0.5 });
                const m = new THREE.Mesh(geo, mat);
                m.position.set((rand() - 0.5) * 44, (rand() - 0.5) * 18, rand() * stage.length);
                stageGroup.add(m);
            }

            // start checkpoint
            const startCheck = new THREE.Vector3(0, 0, -24);
            entities.push(createCheckpointSphere(startCheck, 1.05));

            // first ring
            let prev = new THREE.Vector3(0, 1.2, 30);
            addRingAt(prev, rand, diff);

            const totalRows = Math.max(3, Math.round(stage.length / stage.ringSpacing) - 1);
            for (let row = 1; row < totalRows; row++) {
                const z = prev.z + stage.ringSpacing;
                const xAmp = Math.min(6.0, 0.8 + row * 0.03 + diff * 1.5 + Math.sin(row * 0.35) * (0.4 + diff * 1.5));
                const yAmp = Math.min(4.2, 0.9 + diff * 2.0 + Math.sin(row * 0.31) * 0.5);
                const x = Math.sin(row * 0.73 + rand() * 0.6) * xAmp + (rand() - 0.5) * 0.8;
                const y = Math.sin(row * 0.46 + rand() * 1.1) * yAmp + 0.6;

                if (rand() < 0.34 + diff * 0.66) addObstaclePair(pos, diff, row);

                    const offY = clamp((rand() - 0.5) * (6 + diff * 3), -6.5, 6.8);

            updateHudLives();

        function addRingAt(pos, rand, diff) {

            const mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color(0.10, 0.85, 0.56),
                emissive: new THREE.Color(0.05, 0.45, 0.28),
                emissiveIntensity: 0.8,
                roughness: 0.5, metalness: 0.1

            ring.position.copy(pos);
            ring.rotation.set(rand() * 0.2, rand() * 0.25, rand() * 0.25);
            ring.userData = { type: "ring", radius: passRadius, passed: false };
            if (stageGroup) stageGroup.add(ring);
            entities.push(ring);
            stage.totalRings++;

        function addObstaclePair(centerPos, diff, row) {

            const wallHalf = 0.9;
            const gap = ringRadius + 1.2 + wallHalf;
            const wallH = 1.4 + diff * 0.5;
            const wallD = 0.9 + diff * 0.1;
            const colorA = new THREE.Color(0.18 + Math.abs(Math.sin(row * 0.45)) * 0.16, 0.38, 0.27);

                const geo = new THREE.BoxGeometry(wallHalf * 2, wallH, wallD);
                const wall = new THREE.Mesh(geo, makeStandard(colorA, "#101910", 0.65, 0.07));
                wall.position.set(centerPos.x + side * gap, centerPos.y, centerPos.z);
                wall.userData = { type: "obstacle", half: wallHalf };
                if (stageGroup) stageGroup.add(wall);
                entities.push(wall);
            }

        function addFinishGate(pos) {

                emissive: new THREE.Color(0.6, 0.5, 0.1),

        function updateGame(dt) {
            const s = stageState;
            const input = readInputs();
            s.invuln = Math.max(0, s.invuln - dt);
            s.t += dt;

            const acc = 8 + Math.min(7, Math.floor(Math.min(s.passed, 800) / 55));
            s.speed = Math.min(stage.baseSpeed * 1.03, s.speed + acc * dt);
            if (input.brake) s.speed = Math.max(8.5, s.speed - (stage.baseSpeed * 0.55 + 20) * dt);

            const lateral = input.x * (6.2 - stage.diff * 0.7);
            const vert = input.y * (4.2 - stage.diff * 0.75);
            player.position.x = clamp(player.position.x + lateral * dt, -10.4, 10.4);
            player.position.y = clamp(player.position.y + vert * dt, -7.2, 7.4);
            player.position.z += s.speed * dt;

            player.rotation.z = -lateral * 0.18;
            player.rotation.x = vert * 0.12;
            if (input.brake) player.rotation.x -= 0.24;

            camera.position.x += (player.position.x * 0.45 - camera.position.x) * 0.12;
            camera.position.y += (player.position.y + 6.5 - camera.position.y) * 0.10;
            camera.position.z += (player.position.z - 26 - camera.position.z) * 0.16;
            camera.lookAt(player.position.x * 0.25, player.position.y + 1.2, player.position.z + 50);

            if (stage.finishEntity) stage.finishEntity.rotation.z += dt * 0.6;

            playerMatFlash();

            if (currentScreen !== "play") return;
            updateCollisionsAndWin();
            updateHudValues();

            if (s.t >= stage.timeLimit) { stageFail("time"); return; }
        }

        function playerMatFlash() {
            if (!player || !player.material) return;
            if (stageState && stageState.invuln > 0) {
                const flick = (stageState.invuln * 11) % 2 > 0.75;
                player.material.emissiveIntensity = flick ? 1.2 : 0.2;
            } else {
                player.material.emissiveIntensity = 0.6;
            }
        }

        function updateHudValues() {
            hudTime.textContent = formatTime(stageState.t) + " / " + formatTime(stage.timeLimit);
            hudScore.textContent = String(Math.max(0, Math.round(stageState.score)));
            hudRings.textContent = stageState.ring + "/" + stage.totalRings;
            hudStage.textContent = String(currentStageNumber);
        }
        function updateHudLives() {
            const l = Math.max(0, stageState.lives);
            hudLives.textContent = Array(3).fill(0).map((_, i) => (i < l ? "❤" : "✕")).join("");
            hudLives.style.color = "#ff6990";
        }
        function addScore(n) { stageState.score += n; }
        function onHit() {
            if (stageState.invuln > 0) return;
            stageState.lives--;
            stageState.hits++;
            stageState.invuln = 1.55;
            sfxHit();
            updateHudLives();
            if (stageState.lives <= 0) stageFail("hp");

        function passEntity(ent) {
            if (!ent || !ent.userData) return;
            if (ent.userData.type === "check") {
                if (ent.userData.done) return;
                ent.userData.done = true;
                addScore(16);
                checkpoint = ent.position.clone();
            }
            if (ent.userData.type === "ring" && !ent.userData.passed) {
                ent.userData.passed = true;
                stageState.passed++;
                stageState.ring = stageState.passed;
                addScore(80 + Math.floor((1 - stage.diff) * 10));
                sfxRing();
                if (ent.material) {
                    ent.material.color.set(0.03, 0.9, 0.4);
                    ent.material.emissive.set(0.02, 0.4, 0.18);
                }
            }
            if (ent.userData.type === "orb" && !ent.userData.collected) {
                ent.userData.collected = true;
                stageState.orb++;
                addScore(42 + Math.floor((1 - stage.diff) * 12));
                sfxCollect();
            }
            if (ent.userData.type === "finish") finishStage();
        }
        function updateCollisionsAndWin() {
            const s = stageState;
            const pz = player.position.z;
            for (let i = 0; i < entities.length; i++) {
                const ent = entities[i];
                if (!ent || !ent.userData) continue;
                const dz = ent.position.z - pz;
                if (dz > 14 || dz < -14) continue;
                const dx = ent.position.x - player.position.x;
                const dy = ent.position.y - player.position.y;
                const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
                if (ent.userData.type === "ring") { if (d < ent.userData.radius) passEntity(ent); }
                else if (ent.userData.type === "orb") { if (d < player.radius + ent.userData.radius) passEntity(ent); }
                else if (ent.userData.type === "check") { if (d < player.radius + ent.userData.radius) passEntity(ent); }
                else if (ent.userData.type === "obstacle") { if (d < player.radius + ent.userData.half) onHit(); }
                else if (ent.userData.type === "finish") { if (d < ent.userData.radius) passEntity(ent); }
            }
            // missed the goal -> fail (prevents infinite running)
            if (player.position.z > stage.finishZ + 12) { stageFail("missed"); return; }
        }
        function finishStage() {
            if (stageEnded) return;
            stageEnded = true;
            stopBgm(); sfxClear();
            const timeBonus = Math.max(0, Math.floor(1200 - stageState.t * 10));
            const finalScore = Math.floor(stageState.score + timeBonus + Math.max(0, stageState.lives) * 420 + stageState.orb * 16);
            save.progress.maxStage = Math.max(save.progress.maxStage, currentStageNumber + 1);
            save.progress.totalClears = (save.progress.totalClears || 0) + 1;
            saveNow();
            updateBestResult(currentStageNumber, finalScore, stageState.t);
            renderResult("clear");
            isPlaying = false;
        }
        function stageFail(reason) {
            if (stageEnded) return;
            stageEnded = true;
            sfxFail(); stopBgm();
            updateBestResult(currentStageNumber, Math.max(0, Math.floor(stageState.score)), stageState.t);
            renderResult("fail", reason);
            isPlaying = false;
        }
        function updateBestResult(stageNo, sc, tm) {
            save.progress.currentStage = stageNo;
            save.progress.nextStage = Math.max(1, Math.max(stageNo + 1, save.progress.nextStage || 1));
            save.progress.maxStage = Math.max(save.progress.maxStage || 1, save.progress.nextStage);
            const key = String(stageNo);
            const best = save.progress.best[key];
            const bestScore = Math.max(best ? best.s : 0, sc);
            const bestTime = best && isFinite(best.t) && best.t < 1e8 ? Math.min(best.t, tm) : tm;
            save.progress.best[key] = { s: bestScore, t: bestTime };
            saveNow();
        }
        function renderResult(kind, reason) {
            const clear = kind === "clear";
            const sc = Math.max(0, Math.floor(stageState ? stageState.score : 0));
            const best = save.progress.best[String(currentStageNumber)] || { s: sc, t: stageState?.t || 0 };
            let titleKey = clear ? "clear" : "fail";
            if (!clear && reason === "time") titleKey = "failTime";
            if (!clear && reason === "missed") titleKey = "failMissed";
            document.getElementById("resultTitle").textContent = t(titleKey);
            document.getElementById("resultStage").textContent = String(currentStageNumber);
            document.getElementById("resultScore").textContent = String(sc);
            document.getElementById("resultTime").textContent = formatTime(stageState?.t || 0);
            document.getElementById("resultBestScore").textContent = String(Math.max(0, best.s || sc));
            document.getElementById("resultBestTime").textContent = fmtSeconds(best.t);
            document.getElementById("btnNext").classList.toggle("hidden", !clear);
            setScreen("result");
        }
        function tick(now) {
            if (!renderer) return requestAnimationFrame(tick);
            requestAnimationFrame(tick);
            if (!lastFrameTime) { lastFrameTime = now; return; }
            let dt = Math.min(0.055, (now - lastFrameTime) / 1000);
            lastFrameTime = now;
            if (dt <= 0) return;
            renderer.render(scene, camera);
            if (!isPlaying || currentScreen !== "play" || isPaused) return;
            try { updateGame(dt); } catch (err) { console.error(err); }
        }
        function startStage(n) {
            if (!renderer) { if (!initThree()) { applyLanguage(); setScreen("error"); return; } }
            startAudio();
            currentStageNumber = Math.max(1, n);
            stageEnded = false;
            if (!loadStage(currentStageNumber)) { setScreen("error"); return; }
            isPlaying = true; manualPaused = false; orientationPaused = false; isPaused = false; stageEnded = false;
            applySoundSettings(); checkOrientation();
            setTimeout(() => { renderer && renderer.render(scene, camera); }, 50);
        }

        function setupEvents() {
            makeLanguageButtons(); applyLanguage(); updateLanguageButtons(); bindControls();
            bindSoundButton("btnSoundMaster", "master");
            bindSoundButton("btnSoundBgm", "bgm");
            bindSoundButton("btnSoundSfx", "sfx");
            window.addEventListener("resize", onResize);
            window.addEventListener("orientationchange", onResize);
            document.addEventListener("gesturestart", (e) => e.preventDefault());
            document.querySelectorAll("button[data-screen]").forEach(btn => {
                btn.addEventListener("click", () => {
                    startAudio();
                    const name = btn.dataset.screen;
                    if (name === "stage") renderStageList();
                    if (name !== "pause") { isPlaying = false; isPaused = false; manualPaused = false; }
                    setScreen(name); checkOrientation();
                });
            });
            document.querySelectorAll("button[data-action]").forEach(btn => {
                btn.addEventListener("click", () => {
                    startAudio();
                    const a = btn.dataset.action;
                    if (a === "start") { currentStageNumber = save.progress.currentStage || save.progress.nextStage || 1; renderStageList(); startStage(currentStageNumber); }
                    if (a === "fullscreen") toggleFullscreen();
                    if (a === "resume") {
                        isPlaying = true; manualPaused = false;
                        if (currentScreen !== "play") { if (player && renderer && scene) renderer.render(scene, camera); }
                        togglePause(true, true); setScreen("play"); applySoundSettings();
                    }
                    if (a === "next") { currentStageNumber = Math.max(currentStageNumber + 1, save.progress.nextStage || currentStageNumber + 1); renderStageList(); startStage(currentStageNumber); }
                    if (a === "retry") startStage(currentStageNumber);
                });
            });
            document.addEventListener("fullscreenchange", () => {
                if (!document.fullscreenElement && window.innerHeight > window.innerWidth) checkOrientation();
                checkOrientation();
            });
            checkOrientation();
        }
        function firstBoot() {
            setupEvents(); applySoundSettings();
            document.getElementById("screen-title").classList.remove("hidden");
            applyLanguage();
        }
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", firstBoot);
        else firstBoot();

        window.skyMazeSave = () => save;
        window.skyMazeSaveReset = () => { try { localStorage.removeItem(SAVE_KEY); location.reload(); } catch (e) { } };
    </script>
</body>
